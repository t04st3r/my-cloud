# Development compose: runs ONLY Postgres so the Django app can be run on the
# host with `uv run ./manage.py runserver`.
#
#   docker compose -f docker-compose-dev.yaml up -d
#   uv run ./manage.py migrate
#   uv run ./manage.py runserver
services:
  db:
    image: postgres:17-alpine
    container_name: my-cloud-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - my-cloud-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  my-cloud-dev-db-data:
