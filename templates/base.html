<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script>
        /* Set the theme before first paint to avoid a flash. */
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    {% load static %}
    <link rel='shortcut icon' href='{% static "my_cloud/img/favicon-my-cloud.ico" %}'/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
          integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href='{% static "my_cloud/css/site.css" %}'/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <title>My Cloud</title>
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark sticky-top bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-cloud-download-alt"></i> My Cloud</a>
        <ul class="nav">
            {% if not request.user.is_authenticated %}
            <li class="nav-item">
                <a href="/login" class="nav-link">Log in</a>
            </li>
            {% else %}
            <li class="nav-item">
                <a href="/" class="nav-link">Files</a>
            </li>
            <li class="nav-item">
                <a href="/s" class="nav-link">Schemes</a>
            </li>
            <li class="nav-item">
                <form method="post" action="/logout/" class="form-inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-link logout-btn">Log out</button>
                </form>
            </li>
            {% endif %}
            <li class="nav-item">
                <a href="/help/" class="nav-link">Help</a>
            </li>
            <li class="nav-item">
                <a href="#" id="theme-toggle" class="nav-link" title="Toggle light / dark" aria-label="Toggle light / dark">
                    <i class="fas fa-moon"></i>
                </a>
            </li>
        </ul>
    </div>
</nav>
<main class="container content_wrapper">
    {% block content %}
    {% endblock %}
</main>
<script>
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        function setIcon() {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            btn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        setIcon();
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            var t = dark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
            try { localStorage.setItem('theme', t); } catch (e) {}
            setIcon();
        });
    })();
</script>
</body>
</html>
